dataset:
  name: StaggerDataGenerator
  description: "Stream generator producing three boolean features describing objects:\n
                size, shape and colour. Dataset originally introduced in:\n
                Schlimmer, J. C., & Granger, R. H. (1986). Incremental learning from.\n
                noisy data. Machine learning, 1(3), 317-354."
  parameters:
    - name: seed
      description: The seed of the random generator
  features:
    - name: size
      description: The size of the object, one of small, medium, large
      formula: Categorical("small", "medium", "large")
    - name: shape
      description: The shape of the object, one of circle, square, triangle
      formula: Categorical("circle", "square", "triangle")
    - name: color
      description: The color of the object, one of red, blue, green
      formula: Categorical("red", "blue", "green")
  target:
    name: y
    description: The target variable defined as a function of the features
    classtype: Binary
    formula: size == "small" and color == "red"
    drift:
      type: changeformula
      formulas:
        - value: color == "green" or shape == "circle"
        - value: size == "medium" or size == "large"
  run:
    arguments:
      - name: seed
        value: 42
