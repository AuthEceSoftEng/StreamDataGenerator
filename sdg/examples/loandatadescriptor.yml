dataset:
  name: LoanDatasetStreamGenerator
  description: "A stream generator for loans, introduced in publication:\n
                Kalaitzidis, E., Diamantopoulos, T., Michailoudis, A., Symeonidis, A. L. (2025).\n
                AML4S: An AutoML Pipeline for Data Streams. Machine Learning and Knowledge Extraction 7.3, 87.\n
                This generator is based on the generator introduced by Agrawal et al.\n
                (Agrawal, R., Ghosh, S., Imielinski, T., Iyer, B., & Swami, A. N. (1992).\n
                An interval classifier for database mining applications. In VLDB (Vol. 92, pp. 560-573).\n
                Available: https://agrawal-family.com/rakesh/papers/vldb92ic.pdf.)"
  parameters:
    - name: seed
      description: The seed of the random generator
  features:
    - name: salary
      description: Salary
      formula: UniformFloat(20000, 60000)
      drift:
        type: changeformula
        formulas:
          - name: crisis
            value: UniformFloat(10000, 40000)
          - name: growth
            value: UniformFloat(30000, 80000)
    - name: commission
      description: Commission
      formula: UniformFloat(0, 0.1 * salary)
    - name: age
      description: Age
      formula: UniformInteger(20, 80)
    - name: educationlevel
      description: Education Level
      formula: UniformInteger(0, 4)
    - name: zipcode
      description: Zip Code of the Town
      formula: UniformInteger(0, 8)
    - name: housevalue
      description: House Value
      formula: UniformFloat(100000 * (8 - zipcode + 1), 2 * 100000 * (8 - zipcode + 1))
    - name: loanyears
      description: Years of the Loan
      formula: UniformInteger(10, 30)
    - name: loan
      description: Total Loan Amount
      formula: UniformFloat(10000, 0.85 * housevalue)
  target:
    name: loanapproval
    description: Loan Approval
    classtype: Binary
    formula: (loan <= 20 * salary + 0.5 * commission) and (loan <= 0.7 * housevalue) and
             ((age < 20 and salary + 0.5 * commission >= 20000) or
             (age < 40 and salary + 0.5 * commission >= 25000) or
             (age < 60 and salary + 0.5 * commission >= 30000))
    drift:
      type: changeformula
      formulas:
        - name: crisis
          value: (loan <= 10 * salary) and (loan <= 0.5 * housevalue) and
                 ((age < 20 and salary >= 30000) or
                 (age < 40 and salary >= 40000) or
                 (age < 60 and salary >= 50000))
        - name: growth
          value: (loan <= 50 * salary + commission) and (loan <= 0.9 * housevalue) and
                 ((age < 20 and salary + commission >= 10000) or
                 (age < 40 and salary + commission >= 15000) or
                 (age < 60 and salary + commission >= 20000))
  run:
    arguments:
      - name: seed
        value: 42
