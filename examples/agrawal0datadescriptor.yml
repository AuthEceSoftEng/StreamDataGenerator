dataset:
  name: Agrawal0DataGenerator
  description: "Stream generator introduced by Agrawal et al.\n\n
                Relevant paper:\n
                Agrawal, R., Ghosh, S., Imielinski, T., Iyer, B., & Swami, A. N. (1992).\n
                An interval classifier for database mining applications. In VLDB (Vol. 92, pp. 560-573).\n
                Available online: https://agrawal-family.com/rakesh/papers/vldb92ic.pdf"
  parameters:
    - name: seed
      description: The seed of the random generator
  features:
    - name: salary
      description: Salary
      formula: UniformFloat(20000, 150000)
    - name: commission
      description: Commission
      formula: 0 if salary < 75000 else UniformFloat(10000, 75000)
    - name: age
      description: Age
      formula: UniformInteger(20, 80)
    - name: educationlevel
      description: Education Level
      formula: UniformInteger(0, 4)
    - name: car
      description: Car Maker
      formula: UniformInteger(1, 20)
    - name: zipcode
      description: Zip Code of the Town
      formula: UniformInteger(0, 8)
    - name: housevalue
      description: House Value
      formula: UniformFloat(50000 * zipcode, 100000 * zipcode)
    - name: houseyears
      description: Years House Owned
      formula: UniformInteger(1, 30)
    - name: loan
      description: Total Loan Amount
      formula: UniformFloat(0, 500000)
  target:
    name: loanapproval
    description: Loan Approval (classification function 0 of the original paper is used)
    classtype: Binary
    formula: age < 40 or 60 <= age
    drift:
      type: changeformula
      formulas:
        - value: age < 40 or 60 <= age
        - value: (age < 40 and 50000 <= salary and salary <= 100000) or
                 (age < 60 and 75000 <= salary and salary <= 125000) or
                 (25000 <= salary and salary <= 75000)
  run:
    arguments:
      - name: seed
        value: 42
